name: Produce Arabic Video

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode JSON filename"
        required: true
        default: "video_001.json"
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/**"
      - ".github/workflows/produce-video.yml"

permissions:
  contents: read

concurrency:
  group: zoro-video-production
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        name: Checkout
      - name: Install FFmpeg and Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra
      - uses: actions/setup-python@v5
        name: Set up Python
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Render video
        run: |
          EPISODE="${{ github.event.inputs.episode || 'video_001.json' }}"
          python scripts/produce.py "content/$EPISODE"
      - name: Validate MP4
        run: |
          VIDEO=$(find output -maxdepth 1 -name '*.mp4' ! -name '*voice*' -print -quit)
          test -n "$VIDEO"
          test -s "$VIDEO"
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$VIDEO"
      - uses: actions/upload-artifact@v4
        name: Upload finished video package
        with:
          name: zoro-video-output
          path: output/
          if-no-files-found: error
          retention-days: 14
