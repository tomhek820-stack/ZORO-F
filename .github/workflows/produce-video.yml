name: Produce Arabic Video

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode JSON filename"
        required: true
        default: "video_001.json"
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/**"
      - "assets/**"
      - "requirements.txt"
      - ".github/workflows/produce-video.yml"

permissions:
  contents: read

concurrency:
  group: zoro-video-production
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        name: Checkout

      - name: Install FFmpeg and Arabic text layout libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra libharfbuzz0b libfribidi0 libraqm0

      - name: Download the approved Arabic asset bundle
        run: |
          mkdir -p assets/fonts
          curl --fail --location --retry 3 \
            "https://github.com/tomhek820-stack/ZORO-F/releases/download/arabic-assets-001/ZORO_ARABIC_ASSETS.tar.gz" \
            -o /tmp/zoro-arabic-assets.tar.gz
          tar -xzf /tmp/zoro-arabic-assets.tar.gz -C "$GITHUB_WORKSPACE" --no-same-owner
          test -s assets/fonts/NotoNaskhArabic-Regular.ttf
          test -s assets/fonts/Amiri-Bold.ttf
          echo "Arabic font bundle is ready."

      - uses: actions/setup-python@v5
        name: Set up Python
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Arabic shaping and font coverage
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, features
          from pathlib import Path
          assert features.check_feature("raqm"), "Pillow was built without RAQM"
          font = ImageFont.truetype("assets/fonts/NotoNaskhArabic-Regular.ttf", 64,
                                    layout_engine=ImageFont.Layout.RAQM)
          image = Image.new("RGB", (1000, 180), "white")
          draw = ImageDraw.Draw(image)
          sample = "أبو محمد المساوى — الذكاء الاصطناعي"
          box = draw.textbbox((0, 0), sample, font=font, direction="rtl", language="ar")
          assert box[2] > box[0], "Arabic text metrics are invalid"
          draw.text((950, 20), sample, font=font, fill="black",
                    direction="rtl", language="ar")
          image.save("/tmp/arabic-layout-smoke-test.png")
          print("RAQM Arabic shaping test passed.")
          PY

      - name: Render video
        run: |
          EPISODE="${{ github.event.inputs.episode || 'video_001.json' }}"
          python scripts/produce.py "content/$EPISODE"

      - name: Validate MP4 and audio
        run: |
          VIDEO=$(find output -maxdepth 1 -name '*.mp4' ! -name '*voice*' -print -quit)
          AUDIO=$(find output -maxdepth 1 -name '*_voice.mp3' -print -quit)
          test -n "$VIDEO" && test -s "$VIDEO"
          test -n "$AUDIO" && test -s "$AUDIO"
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$VIDEO"
          ffprobe -v error -show_entries stream=codec_name,sample_rate -of default=noprint_wrappers=1 "$AUDIO"

      - uses: actions/upload-artifact@v4
        name: Upload finished video package
        with:
          name: zoro-video-output
          path: output/
          if-no-files-found: error
          retention-days: 14
